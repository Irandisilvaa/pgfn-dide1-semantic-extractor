[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgfn-dide1-router"
version = "4.0.0"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "requests>=2.32,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
